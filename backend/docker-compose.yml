services:
  # 1. NestJS App 서비스 (이름을 'app'으로 지정)
  app:
    build:
      context: . # 현재 디렉토리의 Dockerfile을 사용
      dockerfile: Dockerfile.dev
    depends_on:
      - db # 'db' 서비스가 먼저 실행된 후에 'app'이 실행되도록 순서 지정
    ports:
      - '3000:3000' # 내 컴퓨터의 3000번 포트와 컨테이너의 3000번 포트를 연결
    environment:
      # NestJS 앱 내부에서 사용할 환경 변수 (예: .env 파일 대신)
      DB_HOST: db # 'db' 서비스의 호스트 이름
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: mypassword # DB 비밀번호 (보안을 위해 .env 사용 권장)
      DB_NAME: webosdb # DB 이름
    networks:
      - my-network # 아래에 정의된 'my-network' 사용
    volumes:
      # [추가] 소스 코드 실시간 동기화
      # 1. 현재 디렉토리(.)를 컨테이너의 /usr/src/app과 연결
      - .:/usr/src/app
      # 2. (중요) node_modules는 컨테이너 내부의 것(npm install로 설치된)을 사용
      # (내 컴퓨터의 node_modules가 덮어쓰는 것을 방지)
      - /usr/src/app/node_modules

  # 2. MySQL DB 서비스 (이름을 'db'로 지정)
  db:
    image: mysql:8.0 # MySQL 8.0 공식 이미지를 사용
    restart: always # 컨테이너가 중지되면 항상 재시작
    environment:
      # MySQL 컨테이너가 시작될 때 사용할 환경 변수
      MYSQL_ROOT_PASSWORD: mypassword # 루트 비밀번호
      MYSQL_DATABASE: webosdb # 생성할 데이터베이스 이름
    ports:
      - '3306:3306' # 내 컴퓨터의 3306 포트와 컨테이너의 3306 포트 연결
    volumes:
      - db-data:/var/lib/mysql # DB 데이터를 내 컴퓨터에 저장 (컨테이너가 삭제돼도 데이터 보존)
    networks:
      - my-network

# 서비스 간 통신을 위한 네트워크 정의
networks:
  my-network:
    driver: bridge

# DB 데이터 영속성을 위한 볼륨 정의
volumes:
  db-data:

name: Deploy Frontend to NCP VM

on:
  push:
    branches:
      - main
    paths:
      # frontend 폴더 하위의 모든 변경 사항 감지
      - 'frontend/**'
      # 이 워크플로우 파일 자체의 변경 사항 감지
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build-and-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest # GitHub Actions가 실행될 환경

    steps:
      # 1. 레포지토리 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 환경 설정 (Vite 빌드를 위함)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # React, Vite와 호환되는 Node.js LTS 버전 권장
          node-version: '20'
          # npm 의존성 캐싱으로 설치 속도 향상
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. 프론트엔드 의존성 설치 (frontend 폴더 기준)
      - name: Install Frontend Dependencies
        run: npm ci # package-lock.json 기반으로 설치 (ci에서 권장)
        working-directory: ./frontend

      # 4. 프론트엔드 프로젝트 빌드
      - name: Build Frontend Project
        run: npm run build # Vite 빌드 스크립트 실행
        working-directory: ./frontend
        # 빌드 결과물은 frontend/dist 디렉토리에 생성됨

      # 5. SSH를 사용하여 빌드 결과물을 NCP VM으로 배포
      - name: Deploy to VM via SSH
        uses: easingthemes/ssh-deploy@main
        with:
          # GitHub Secrets에 등록된 값들을 사용
          SSH_PRIVATE_KEY: ${{ secrets.NCP_VM_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.NCP_SERVER_IP }}
          REMOTE_USER: ${{ secrets.NCP_SERVER_USER }}

          # 🚨 SOURCE: 'dist' 폴더 *내용물*을 의미 (뒤에 /가 매우 중요)
          SOURCE: 'frontend/dist/'

          # 🚨 TARGET: Nginx가 정적 파일을 서빙하는 VM의 실제 경로 (아래 설명 참고)
          TARGET: '/var/www/web01-web-os-emulation/frontend/dist'

          # rsync 옵션: -a (archive), -v (verbose), -z (compress), --delete (TARGET에 없는 파일 삭제)
          ARGS: '-avz --delete'

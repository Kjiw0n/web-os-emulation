name: Deploy Backend to NCP VM

on:
  push:
    branches:
      - main
    paths:
      # backend 폴더 하위의 모든 변경 사항 감지
      - 'backend/**'
      # 이 워크플로우 파일 자체의 변경 사항 감지
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-push-and-deploy:
    name: Build, Push (NCR) and Deploy (VM)
    runs-on: ubuntu-latest

    steps:
      # 1. 레포지토리 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Docker QEMU 설정
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. NCP Container Registry 로그인
      - name: Login to NCP Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NCP_REGISTRY_ENDPOINT }}
          username: ${{ secrets.NCP_REGISTRY_USERNAME }}
          password: ${{ secrets.NCP_REGISTRY_PASSWORD }}

      # 5. Docker 이미지 메타데이터 설정 (태그 생성)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # (사용자님이 작성하신 이미지 이름 그대로 사용)
          images: ${{ secrets.NCP_REGISTRY_ENDPOINT }}/webos-nestjs/app
          # Git commit SHA를 태그로 사용 (예: .../app:a1b2c3d)
          tags: type=sha,prefix=,suffix=,format=short

      # 6. Docker 이미지 빌드 및 NCR 푸시
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile # (프로덕션 Dockerfile 경로 확인)
          push: true
          # 🚨 tags가 중요: 방금 meta에서 생성된 '.../app:a1b2c3d' 태그를 사용
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. NCP VM에 SSH 접속 및 배포 (수정된 스크립트)
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NCP_SERVER_IP }}
          username: ${{ secrets.NCP_SERVER_USER }}
          key: ${{ secrets.NCP_VM_SSH_KEY }}
          script: |
            # 1. VM에서 NCP 레지스트리 로그인 (필수)
            echo ${{ secrets.NCP_REGISTRY_PASSWORD }} | docker login ${{ secrets.NCP_REGISTRY_ENDPOINT }} --password-stdin

            # 2. 🚨 새 이미지 태그(URI)를 환경 변수로 "내보내기"
            # (이것이 1번에서 설정한 ${NESTJS_IMAGE_URI} 변수로 전달됨)
            export NESTJS_IMAGE_URI=${{ steps.meta.outputs.tags }}

            # 3. docker-compose 파일이 있는 경로로 이동
            cd /root

            # 4. 🚨 docker-compose가 NESTJS_IMAGE_URI 변수를 읽어 'app' 서비스의 "새 이미지"를 PULL
            docker compose -f docker-compose.prod.yml pull app

            # 5. 🚨 "새 이미지"로 'app' 서비스만 재시작 (mysql은 건드리지 않음)
            docker compose -f docker-compose.prod.yml up -d --no-deps app

            # 6. 사용 중이지 않은 모든 이미지 삭제 (디스크 공간 확보)
            docker image prune -a -f

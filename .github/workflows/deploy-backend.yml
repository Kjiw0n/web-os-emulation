name: CI/CD Backend (Build and Deploy)

on:
  push:
    branches:
      - main
    paths:
      # 1. 백엔드 소스코드 변경 시 (이미지 재빌드 필요)
      - 'backend/**'
      # 2. 백엔드 배포 설정 변경 시 (이미지 재빌드 불필요, 배포만)
      - 'docker-compose.prod.yml'
      # 3. 워크플로 자체 변경 시
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:

# [핵심] 레지스트리 주소를 환경변수로 등록 (재사용)
env:
  NCP_REGISTRY_HOST: webos-nestjs.kr.ncr.ntruss.com
  IMAGE_NAME: webos-nestjs/app # 레지스트리 호스트를 제외한 이미지 이름

jobs:
  # ==================================
  # 1. CI (Build & Push Image) Job
  # ==================================
  build:
    runs-on: ubuntu-latest
    # [핵심] 백엔드 코드가 변경되었을 때만 실행
    # (docker-compose.yml만 바뀌면 이 작업은 스킵됨)
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      (
        github.event_name == 'workflow_dispatch' ||
        exists(github.event.commits) && contains(join(github.event.commits.*.modified, ' '), 'backend/') ||
        exists(github.event.commits) && contains(join(github.event.commits.*.added, ' '), 'backend/')
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to NCP Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NCP_REGISTRY_HOST }}
          username: ${{ secrets.NCP_REGISTRY_USERNAME }} # Access Key
          password: ${{ secrets.NCP_REGISTRY_PASSWORD }} # Secret Key

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend # Dockerfile이 있는 디렉터리
          file: ./backend/Dockerfile # Dockerfile 경로
          push: true # 빌드 후 푸시
          tags: ${{ env.NCP_REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:latest # :latest 태그로 푸시
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================================
  # 2. CD (Deploy to VM) Job
  # ==================================
  deploy:
    runs-on: ubuntu-latest
    # [핵심] build 작업이 성공적으로 끝나야만 실행됨
    # (build가 스킵된 경우에도 실행됨 - compose.yml만 바뀐 경우)
    needs: build

    steps:
      # (배포 단계에서는 compose.yml 파일만 필요)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. docker-compose.prod.yml 파일을 VM으로 복사
      - name: Copy compose file via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NCP_VM_HOST }}
          username: ${{ secrets.NCP_VM_USERNAME }}
          key: ${{ secrets.NCP_VM_SSH_KEY }}
          port: 22
          source: 'docker-compose.prod.yml'
          target: '/home/ubuntu/my-project' # VM의 프로젝트 경로

      # 2. SSH 접속 및 배포 스크립트 실행
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NCP_VM_HOST }}
          username: ${{ secrets.NCP_VM_USERNAME }}
          key: ${{ secrets.NCP_VM_SSH_KEY }}
          port: 22
          script: |
            # 1. VM의 프로젝트 디렉터리로 이동
            cd /home/ubuntu/my-project

            # 2. NCP Container Registry 로그인
            echo ${{ secrets.NCP_REGISTRY_PASSWORD }} | docker login ${{ env.NCP_REGISTRY_HOST }} -u ${{ secrets.NCP_REGISTRY_USERNAME }} --password-stdin

            # 3. 최신 이미지 pull (build 작업에서 푸시한 이미지)
            docker-compose -f docker-compose.prod.yml pull app

            # 4. 'app' 서비스만 재시작 (DB는 건드리지 않음)
            docker-compose -f docker-compose.prod.yml up -d --no-deps app

            # 5. (선택) 사용하지 않는 도커 이미지 정리
            docker image prune -f
